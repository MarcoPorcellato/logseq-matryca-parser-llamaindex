[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "logseq-matryca-parser-llamaindex"
version = "0.1.0"
description = "Optional native LlamaIndex nodes for Logseq Matryca Parser."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Marco Porcellato", email = "marco@matryca.ai" }]
keywords = ["logseq", "llamaindex", "parser", "rag", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "llama-index-core>=0.14.22,<0.15",
    "logseq-matryca-parser>=1.10.0,<1.11.0",
]

[project.urls]
Repository = "https://github.com/MarcoPorcellato/logseq-matryca-parser-llamaindex"
Source = "https://github.com/MarcoPorcellato/logseq-matryca-parser-llamaindex"
Parser = "https://github.com/MarcoPorcellato/logseq-matryca-parser"

[tool.hatch.build.targets.wheel]
packages = ["src/logseq_matryca_parser_llamaindex"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.12,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]
